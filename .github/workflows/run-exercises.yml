name: run-exercises

on:
  pull_request:
  push:
    branches: [main]

jobs:
  run-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only torch and numpy
        run: |
          python -m pip install --upgrade pip
          pip install numpy torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run every tracked Python file
        run: |
          set -u
          failed=0
          for f in $(git ls-files '*.py'); do
            echo "::group::$f"
            # Feed blank lines to stdin so any input() prompt returns immediately.
            if yes '' | head -50 | python "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f::$f exited non-zero"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
